name: Instagram-Token erneuern

# Erneuert das Instagram-Token (danach 60 Tage gueltig) am 1. und 15. jedes Monats und speichert es mit
# GH_ADMIN_TOKEN als Secret IG_ACCESS_TOKEN. Das Token erscheint nie im Log und nie im Repo; im Repo steht nur,
# wann erneuert wurde und bis wann es gilt (v2/status/token.json). Fehler meldet der Waechter.
# Laut Meta muss das Token dafuer mindestens 24 h alt und noch gueltig sein.
# Ausser der Reihe: v2/token.trigger aendern (oder "Run workflow").

on:
  schedule:
    - cron: "17 4 1,15 * *"
  push:
    paths:
      - "v2/token.trigger"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: token-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Token erneuern und als Secret speichern
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: python3 v2/token_refresh.py

      - name: Status festhalten (ohne Token)
        if: always()
        run: |
          if git status --porcelain -- v2/status | grep -q .; then
            git config user.name "geocrimps-bot"
            git config user.email "actions@github.com"
            git add v2/status/token.json
            git commit -m "Token-Erneuerung: Status [skip ci]"
            git pull --rebase --autostash origin main || true
            git push || echo "Push des Status fehlgeschlagen."
          else
            echo "Keine Aenderung."
          fi

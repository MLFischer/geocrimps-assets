name: Kennzahlen

# Kurzbericht jeden Montag 06:47 UTC (Berlin 08:47 Sommer / 07:47 Winter): Kennzahlen je veroeffentlichtem Reel
# (Aufrufe, Reichweite, Skip-Rate, Wiedergabequote, Shares und Saves pro Reichweite) nach v2/kennzahlen/,
# dazu ein Kommentar im Issue "Kennzahlen: Kurzbericht" mit Erwaehnung von @MLFischer (Mail). Nur lesend bei Instagram.
# Ausser der Reihe: v2/kennzahlen.trigger aendern (oder "Run workflow").

on:
  schedule:
    - cron: "47 6 * * 1"
  push:
    paths:
      - "v2/kennzahlen.trigger"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: kennzahlen
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Kennzahlen holen und Bericht schreiben
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 v2/kennzahlen.py

      - name: Bericht festhalten
        if: always()
        run: |
          if git status --porcelain -- v2/kennzahlen | grep -q .; then
            git config user.name "geocrimps-bot"
            git config user.email "actions@github.com"
            git add v2/kennzahlen
            git commit -m "Kennzahlen: Kurzbericht [skip ci]"
            git pull --rebase --autostash origin main || true
            git push || echo "Push des Berichts fehlgeschlagen."
          else
            echo "Keine Aenderung."
          fi
